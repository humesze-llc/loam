[package]
name = "flatland"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Flatland: a 3D solid passing through the z = 0 plane, with the 2D cross-section a Flatlander perceives. Blog-1 dimensional-ladder demo."

[dependencies]
anyhow.workspace = true
glam.workspace = true
wgpu.workspace = true
winit.workspace = true

rye-app    = { path = "../rye-app", default-features = false }
rye-camera = { path = "../rye-camera" }
rye-math   = { path = "../rye-math" }
rye-render = { path = "../rye-render" }
rye-shape  = { path = "../rye-shape" }

[[bin]]
name = "flatland"
path = "src/main.rs"

[features]
default = ["capture"]
capture = ["rye-app/capture"]
