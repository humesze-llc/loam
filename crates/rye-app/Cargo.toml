[package]
name = "rye-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rye App: thin trait + event-loop runner that extracts the winit boilerplate every example rewrites."

[features]
default = ["capture"]
# Frame-capture: PNG single-shot + PNG sequence writers wired into the render loop,
# plus GIF stream encoder + console commands + hotkeys. Disable for lean builds
# that don't need the diagnostic plumbing.
capture = ["dep:image", "dep:gif", "dep:color_quant", "dep:png"]

[dependencies]
anyhow.workspace = true
glam.workspace = true
pollster = "0.3"
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu.workspace = true
winit.workspace = true

image = { version = "0.25", default-features = false, features = ["png"], optional = true }
gif = { version = "0.13", optional = true }
color_quant = { version = "1.1", optional = true }
png = { version = "0.17", optional = true }

rye-asset  = { path = "../rye-asset" }
rye-camera = { path = "../rye-camera" }
rye-input  = { path = "../rye-input" }
rye-math   = { path = "../rye-math" }
rye-render = { path = "../rye-render" }
rye-shader = { path = "../rye-shader" }
rye-time   = { path = "../rye-time" }
rye-egui   = { path = "../rye-egui" }
