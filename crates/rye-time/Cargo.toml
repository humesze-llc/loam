[package]
name = "rye-time"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rye time primitives: deterministic fixed-timestep accumulator and tick counter."

[dependencies]
# `web-time` is a drop-in for `std::time::Instant` / `Duration`: on native it re-exports
# the std types verbatim; on wasm32 it backs `Instant` with `performance.now()`. Keeping
# `FixedTimestep` usable in the browser is the only thing that pulls this in.
web-time = { workspace = true }
