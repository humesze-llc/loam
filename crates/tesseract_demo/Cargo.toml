[package]
name = "tesseract_demo"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tesseract w-depth projection + free-roam camera: focused single-pipeline demo. Validates the small-demo perf hypothesis for blog embeds (vs the kitchen-sink polytope_playground)."

# Deliberately minimal dep set:
# - No `rye-render` raymarch types: rasterized wireframe only via LineRasterNode.
# - No triangle/point rasterizer: lines only.
# - No `rye-physics` SDF helpers used; just the Polytope4 topology (vertices + edges).
# - No `rye-shape` other than `LineMesh<4>` (which Visualizable<4> on Polytope4 produces).
# Each unused module gets dead-code-eliminated in release builds, so the wasm bundle
# is much smaller than polytope_playground (which links every render node).

[dependencies]
anyhow.workspace = true
glam.workspace = true
tracing.workspace = true
wgpu.workspace = true
winit.workspace = true

rye-app     = { path = "../rye-app", default-features = false }
rye-camera  = { path = "../rye-camera" }
rye-egui    = { path = "../rye-egui" }
rye-math    = { path = "../rye-math" }
rye-physics = { path = "../rye-physics" }
rye-render  = { path = "../rye-render" }
rye-shape   = { path = "../rye-shape" }

[features]
# Capture feature mirrors polytope_playground: native default-on for frame export,
# wasm opts out via `data-cargo-no-default-features` in index.html.
default = ["capture"]
capture = ["rye-app/capture"]
