[package]
name = "tesseract_demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tesseract w-depth projection + free-roam camera: focused single-pipeline 4D demo."
keywords = ["4d", "tesseract", "demo", "wgpu", "graphics"]
categories = ["game-development", "graphics", "visualization"]

# Deliberately minimal dep set:
# - No `loam-render` raymarch types: rasterized wireframe only via LineRasterNode.
# - No triangle/point rasterizer: lines only.
# - No `loam-physics` SDF helpers used; just the Polytope4 topology (vertices + edges).
# - No `loam-shape` other than `LineMesh<4>` (which Visualizable<4> on Polytope4 produces).
# Each unused module gets dead-code-eliminated in release builds, so the wasm bundle
# is much smaller than polytope_playground (which links every render node).

[dependencies]
anyhow.workspace = true
glam.workspace = true
tracing.workspace = true
wgpu.workspace = true
winit.workspace = true

loam-app     = { path = "../loam-app", default-features = false }
loam-camera  = { path = "../loam-camera" }
loam-egui    = { path = "../loam-egui" }
loam-math    = { path = "../loam-math" }
loam-physics = { path = "../loam-physics" }
loam-render  = { path = "../loam-render" }
loam-shape   = { path = "../loam-shape" }
# Direct dep for the CountingAllocator wrapper installed as #[global_allocator]
# below. Pulls in nothing extra beyond what loam-app already does transitively.
loam-time    = { path = "../loam-time" }

[features]
# Capture feature mirrors polytope_playground: native default-on for frame export,
# wasm opts out via `data-cargo-no-default-features` in index.html.
default = ["capture"]
capture = ["loam-app/capture"]
