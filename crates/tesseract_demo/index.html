<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Tesseract &middot; Rye</title>

    <!-- Standalone workspace crate; Trunk picks up the implicit `[[bin]]` from
         `src/main.rs`. `data-cargo-no-default-features` drops the `capture`
         feature on wasm so native-only encoder crates stay out of the dep tree. -->
    <link data-trunk rel="rust"
          href="Cargo.toml"
          data-cargo-no-default-features />

    <!-- Worker-mode wasm-URL capture. Trunk injects an inline
         `<script type="module">` (immediately above this comment in the
         source order) that contains the import path to the hashed wasm
         bundle. The deferred-execution semantics of `type="module"` mean
         the script's BODY runs at DOMContentLoaded; but its textContent
         is in the DOM as soon as parsed, so this synchronous script can
         regex-extract the URL right now.

         Trunk also adds `<link rel="modulepreload" href="...">` for the
         same URL, but those are appended at the END of `<head>` (below
         this script), so they're not in the DOM yet at the time this
         script runs. Don't query them.

         Why not use Trunk's `data-initializer`: would require a separate
         JS file shipped with each demo. The 6-line regex below is the
         minimum-friction Phase A solution; revisit if multi-demo demos
         start to share a real initializer anyway. -->
    <script>
      // Generic match: trunk emits one `<script type="module">` with an
      // `import init from '/...js'` line. Pick the first `.js` URL in
      // any module-script textContent and expose it for the worker to
      // reuse. Works for any demo without hardcoding the demo name.
      (function () {
        for (const s of document.querySelectorAll('script[type="module"]')) {
          const m = s.textContent.match(/from\s*['"]([^'"]+\.js)['"]/);
          if (m) {
            window.__rye_wasm_url = new URL(m[1], document.baseURI).href;
            return;
          }
        }
      })();
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0e0e12;
            color: #d8d8df;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }
        #rye-canvas-host {
            position: absolute;
            inset: 0;
        }
        #rye-canvas-host canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #0e0e12;
        }
        /* Launch overlay: covers the entire host so clicking anywhere
           triggers the worker's Start signal. The worker has already
           rendered ONE preview frame into the canvas underneath;
           `backdrop-filter: blur(...)` blurs that frame so the viewer
           sees a softened preview of the demo's first frame (not a
           gradient placeholder). On click the overlay is removed,
           revealing the live canvas, and the worker's RAF loop starts. */
        .rye-demo-launch {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font: inherit;
            font-size: 14px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #d8d8df;
            background: rgba(14, 14, 18, 0.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: none;
            cursor: pointer;
            transition: background 200ms ease, opacity 200ms ease;
        }
        .rye-demo-launch::after {
            /* Outlined chip around the text so it reads as interactive
               without dominating the preview. */
            content: 'Click anywhere to launch';
            display: inline-block;
            padding: 14px 28px;
            border: 1px solid rgba(200, 200, 220, 0.5);
            border-radius: 6px;
            background: rgba(20, 20, 28, 0.55);
        }
        .rye-demo-launch:hover {
            background: rgba(14, 14, 18, 0.25);
        }
        .rye-demo-launch:hover::after {
            background: rgba(28, 28, 38, 0.65);
            border-color: rgba(220, 220, 240, 0.7);
        }
        .rye-demo-launch:active {
            background: rgba(14, 14, 18, 0.4);
        }
    </style>
</head>
<body>
    <div id="rye-canvas-host" data-mode="manual">
        <!-- Explicit `<canvas>` in the DOM up front so the main thread
             can `transferControlToOffscreen()` it on click. Width/height
             attributes are a fallback; the launcher recomputes the
             physical-pixel size at click time from CSS dimensions × DPR
             before transferring. -->
        <canvas id="rye-canvas" width="1280" height="800"></canvas>
        <!-- Full-overlay launch button. Click anywhere in the host
             triggers the spawn (the button covers the canvas). On click
             the button removes itself; the canvas underneath becomes
             visible and the worker takes over rendering. The button's
             label is supplied by CSS (`::after`) so the markup stays
             demo-agnostic. -->
        <button id="rye-launch" class="rye-demo-launch" type="button"
                aria-label="Launch demo"></button>
    </div>
</body>
</html>
