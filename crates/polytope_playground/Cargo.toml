[package]
name = "polytope_playground"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Polytope Playground: interactive 4D rotation over Polytope4 with active-set and composer rotor UIs. Native + wasm32."

# Promoted from `examples/polytope_playground/` to a workspace member crate so it can
# be built as a `[[bin]]` target (a requirement for Trunk's wasm pipeline; Trunk can't
# target `[[example]]`). The `cargo run --example polytope_playground` workflow is
# replaced by `cargo run -p polytope_playground` (or just `cargo run --bin
# polytope_playground` from the workspace root); the index.html lives at
# `crates/polytope_playground/index.html` and is the Trunk entry point.

[dependencies]
anyhow.workspace = true
glam.workspace = true
tracing.workspace = true
winit.workspace = true
wgpu.workspace = true

loam-app     = { path = "../loam-app", default-features = false }
loam-camera  = { path = "../loam-camera" }
loam-egui    = { path = "../loam-egui" }
loam-math    = { path = "../loam-math" }
loam-physics = { path = "../loam-physics" }
loam-render  = { path = "../loam-render" }
loam-scene   = { path = "../loam-scene" }
loam-shape   = { path = "../loam-shape" }
loam-time    = { path = "../loam-time" }

[features]
# Default to capture-on for native dev (matches the previous `cargo run --example`
# behavior, which inherited loam-app's default features). The wasm build at
# `index.html` opts out via `data-cargo-no-default-features`, dropping the native-only
# encoder crates and routing console commands through `capture_stub.rs`.
default = ["capture"]
capture = ["loam-app/capture"]
