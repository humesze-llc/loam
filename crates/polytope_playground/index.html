<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Polytope Playground &middot; Loam</title>

    <!-- `polytope_playground` is a workspace member crate (promoted from the
         `examples/` tree because Trunk's wasm pipeline can only target `[[bin]]`,
         not `[[example]]`). The local `Cargo.toml` declares an implicit binary
         from `src/main.rs`; Trunk picks it up automatically. The
         `data-cargo-no-default-features` flag drops the `capture` feature on wasm
         so the native-only encoder crates (image, gif, color_quant, png) stay out
         of the wasm dep tree. -->
    <link data-trunk rel="rust"
          href="Cargo.toml"
          data-cargo-no-default-features />

    <!-- Worker-mode wasm-URL capture. Trunk injects an inline
         `<script type="module">` (immediately above this comment in source
         order) containing the import path to the hashed wasm bundle. This
         synchronous script regex-extracts the URL into
         `window.__loam_wasm_url` so the main-thread Rust code can spawn a
         Worker pointing at the same bundle. Generic across demo names --
         picks the first `.js` import in any module script. -->
    <script>
      (function () {
        for (const s of document.querySelectorAll('script[type="module"]')) {
          const m = s.textContent.match(/from\s*['"]([^'"]+\.js)['"]/);
          if (m) {
            window.__loam_wasm_url = new URL(m[1], document.baseURI).href;
            return;
          }
        }
      })();
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0e0e12;
            color: #d8d8df;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }
        #loam-canvas-host {
            position: absolute;
            inset: 0;
        }
        #loam-canvas-host canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #0e0e12;
        }
        /* `.loam-demo-launch` (the click-to-start overlay) is injected by
           `loam_app::wasm::launch::inject_launch_overlay` along with its
           CSS. Override by shipping a stylesheet later in the cascade.
           The static `#loam-page-loader` spinner that covers the
           wasm-init window is inlined into `#loam-canvas-host` below
           via `data-trunk rel="inline"`; the engine removes it once
           the worker posts `preview_ready`. */
    </style>
</head>
<body>
    <!-- `data-mode="manual"` opts into click-to-start. The wasm runtime
         sees this attribute, injects the `#loam-launch` overlay as a child
         of this host, installs a one-shot click handler that transfers
         `#loam-canvas` to a fresh Worker on click, and runs the App
         lifecycle inside the worker. Remove the attribute for auto-start
         on page load (legacy main-thread mode). -->
    <div id="loam-canvas-host" data-mode="manual">
        <canvas id="loam-canvas" width="1280" height="800"></canvas>
        <!-- Engine-owned static spinner. The fragment lives in
             `crates/loam-app/static/page_loader.html`; Trunk inlines it
             here at build time. -->
        <link data-trunk rel="inline" href="../loam-app/static/page_loader.html" />
    </div>
</body>
</html>
