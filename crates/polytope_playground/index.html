<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Polytope Playground &middot; Rye</title>

    <!-- `polytope_playground` is a workspace member crate (promoted from the
         `examples/` tree because Trunk's wasm pipeline can only target `[[bin]]`,
         not `[[example]]`). The local `Cargo.toml` declares an implicit binary
         from `src/main.rs`; Trunk picks it up automatically. The
         `data-cargo-no-default-features` flag drops the `capture` feature on wasm
         so the native-only encoder crates (image, gif, color_quant, png) stay out
         of the wasm dep tree. -->
    <link data-trunk rel="rust"
          href="Cargo.toml"
          data-cargo-no-default-features />

    <!-- Worker-mode wasm-URL capture. Trunk injects an inline
         `<script type="module">` (immediately above this comment in source
         order) containing the import path to the hashed wasm bundle. This
         synchronous script regex-extracts the URL into
         `window.__rye_wasm_url` so the main-thread Rust code can spawn a
         Worker pointing at the same bundle. Generic across demo names —
         picks the first `.js` import in any module script. -->
    <script>
      (function () {
        for (const s of document.querySelectorAll('script[type="module"]')) {
          const m = s.textContent.match(/from\s*['"]([^'"]+\.js)['"]/);
          if (m) {
            window.__rye_wasm_url = new URL(m[1], document.baseURI).href;
            return;
          }
        }
      })();
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0e0e12;
            color: #d8d8df;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
        }
        #rye-canvas-host {
            position: absolute;
            inset: 0;
        }
        #rye-canvas-host canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #0e0e12;
        }
        /* Click-to-start launch button. Worker mode removes it on click;
           the canvas underneath is revealed when rendering starts. */
        .rye-demo-launch {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font: inherit;
            font-size: 14px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #d8d8df;
            background: #1a1a22;
            border: 1px solid #2a2a35;
            border-radius: 6px;
            padding: 14px 28px;
            cursor: pointer;
            transition: background 120ms ease, border-color 120ms ease;
        }
        .rye-demo-launch:hover {
            background: #22222d;
            border-color: #3a3a48;
        }
        .rye-demo-launch:active {
            background: #1a1a22;
        }
    </style>
</head>
<body>
    <!-- `data-mode="manual"` opts into click-to-start. The wasm runtime
         sees this attribute, installs a one-shot click handler on
         `#rye-launch`, transfers the `#rye-canvas` to a fresh Worker on
         click, and runs the App lifecycle inside the worker. Remove the
         attribute for auto-start on page load (legacy main-thread mode). -->
    <div id="rye-canvas-host" data-mode="manual">
        <canvas id="rye-canvas" width="1280" height="800"></canvas>
        <button id="rye-launch" class="rye-demo-launch" type="button">
            Launch polytope playground
        </button>
    </div>
</body>
</html>
