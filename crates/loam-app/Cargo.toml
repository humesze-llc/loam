[package]
name = "loam-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Loam App: thin trait + event-loop runner that extracts the winit boilerplate every example rewrites."

[features]
default = ["capture"]
# Frame-capture: PNG single-shot + PNG sequence writers wired into the render loop,
# plus GIF stream encoder + console commands + hotkeys. Disable for lean builds
# that don't need the diagnostic plumbing.
capture = ["dep:image", "dep:gif", "dep:color_quant", "dep:png"]

[dependencies]
anyhow.workspace = true
glam.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu.workspace = true
winit.workspace = true
# Wall-clock primitives that work on both native (re-exports `std::time::Instant`) and
# wasm32 (backed by `performance.now()`). Used for the event-loop FPS counter, frame
# timestamps, and capture timing.
web-time = { workspace = true }

# Encoder crates are optional + only meaningful on native (the wasm build routes
# capture through `capture_stub.rs`, which doesn't reference any of these). They stay
# under `[dependencies]` so the `capture = ["dep:image", ...]` feature definition
# resolves cleanly; the actual code that uses them sits behind
# `cfg(all(feature = "capture", not(target_arch = "wasm32")))` in `capture.rs`. Wasm
# builds opt out via `--no-default-features` (which trunk does for us via Trunk.toml).
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
gif = { version = "0.13", optional = true }
color_quant = { version = "1.1", optional = true }
png = { version = "0.17", optional = true }

loam-asset  = { path = "../loam-asset" }
loam-camera = { path = "../loam-camera" }
loam-input  = { path = "../loam-input" }
loam-math   = { path = "../loam-math" }
loam-render = { path = "../loam-render" }
loam-shader = { path = "../loam-shader" }
loam-time   = { path = "../loam-time" }
loam-egui   = { path = "../loam-egui" }

# Direct dep so the worker-mode `WorkerUi` (N5 Phase B4) can use
# `egui_wgpu::Renderer` without going through loam-egui's `UiIntegration`
# (which is winit-coupled). Same version loam-egui pulls in to keep the
# egui type universe consistent across the workspace.
egui-wgpu  = { version = "0.33", default-features = false }

# Native-only async bridge: `pollster::block_on` synchronously awaits the
# `wgpu::Instance::request_adapter` future for `RenderDevice::new`. On wasm there's no
# blocking primitive; `run_with_config` uses `wasm_bindgen_futures::spawn_local`
# instead, declared in the wasm target-specific block below.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.3"

# Wasm-only deps. `wasm-bindgen-futures` bridges `Future` -> JS microtask queue for the
# device-acquisition path. `console_error_panic_hook` surfaces Rust panics in the
# browser dev console with a useful trace instead of `unreachable executed`.
# `tracing-wasm` routes `tracing::*` events to the right console severity levels.
# `web-sys` provides the typed JS bindings for `window.location` (URL params via the
# Args trait), `Performance.now()` (high-res timing in the absence of `Instant`), and
# the canvas attachment for `winit`'s web event loop.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
# `js-sys` provides `Reflect` so the heap sampler can read the non-standard
# `performance.memory.usedJSHeapSize` property without a typed binding (web-sys
# does not surface it because it's Chrome/Edge-only). Used by
# `wasm::js_heap_sampler` and registered into `loam-time::frame_trace` at startup.
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlButtonElement",
    # `HtmlStyleElement` + `HtmlHeadElement` for `inject_launch_overlay`
    # (engine-side click-to-start markup + CSS injection).
    "HtmlStyleElement",
    "HtmlHeadElement",
    "Location",
    "UrlSearchParams",
    "Performance",
    "Event",
    "EventTarget",
    # Worker-mode (Phase A onward). See OFFSCREEN_CANVAS_WORKERS.md.
    # - DedicatedWorkerGlobalScope: type to detect "am I in a worker?"
    #   and to call requestAnimationFrame inside the worker.
    # - Worker: main-thread handle for spawning + posting messages.
    # - OffscreenCanvas: the transferable rendering target.
    # - MessageEvent / MessagePort: postMessage wiring.
    "DedicatedWorkerGlobalScope",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "OffscreenCanvas",
    "MessageEvent",
    # Blob + Url: used to construct an inline ESM bootstrap for the worker
    # (so we don't have to ship a separate worker_bootstrap.js file per
    # demo + the bootstrap can reference the trunk-hashed wasm URL at
    # spawn time).
    "Blob",
    "BlobPropertyBag",
    "Url",
    # DOM event types we forward to the worker from main thread (Phase B3).
    "MouseEvent",
    "KeyboardEvent",
    "WheelEvent",
    "FocusEvent",
    "VisibilityState",
    # Embed lifecycle: CustomEvent broadcasts activation on `document`;
    # Node for the click-off containment test.
    "CustomEvent",
    "CustomEventInit",
    "Node",
] }
