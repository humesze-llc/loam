[package]
name = "rye-asset"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rye asset system: filesystem watching and hot-reload event stream."

[dependencies]
anyhow.workspace = true
tracing.workspace = true

# `notify` is desktop-only: the browser has no filesystem to watch. `src/watcher.rs`
# ships a no-op stub on `wasm32` that keeps the public API shape; the actual watcher
# only compiles + links on native targets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify.workspace = true

[dev-dependencies]
tempfile = "3"
