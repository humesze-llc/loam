[workspace]
members = [
  "crates/loam-math",
  "crates/loam-shape",
  "crates/loam-scene",
  "crates/loam-time",
  "crates/loam-shader",
  "crates/loam-render",
  "crates/loam-asset",
  "crates/loam-input",
  "crates/loam-camera",
  "crates/loam-player",
  "crates/loam-physics",
  "crates/loam-app",
  "crates/loam-text",
  "crates/loam-console",
  "crates/loam-egui",
  "crates/polytope_playground",
  "crates/tesseract_demo",
]
resolver = "2"

[workspace.package]
edition = "2021"
# Tracks the `channel` pin in rust-toolchain.toml; bump both together.
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
version = "0.1.0"
authors = ["Zach Humes <humesze@proton.me>"]
repository = "https://github.com/humesze-llc/loam"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
glam = { version = "0.27", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.8"

wgpu  = { version = "27", features = ["wgsl"] }
winit = "0.30"
naga = { version = "27", features = ["wgsl-in"] }
bytemuck = { version = "1", features = ["derive"] }
notify = "6"
pollster = "0.3"

# `web-time` is a drop-in for `std::time::Instant` / `Duration`: on native it re-exports
# the std types verbatim; on wasm32 it backs `Instant` with `performance.now()`. Used in
# place of `std::time::Instant` anywhere the runtime needs wall-clock-ish timing (event
# loop, FixedTimestep, FPS bookkeeping). Calling `std::time::Instant::now` on wasm32
# panics, so the swap is mandatory for the browser runtime.
web-time = "1"

[package]
name = "loam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Loam: a Rust game engine with non-Euclidean geometry as a primitive"
keywords = ["gamedev", "geometry", "non-euclidean", "4d", "wgpu"]
categories = ["game-engines", "graphics", "mathematics"]

[dependencies]
loam-math      = { path = "crates/loam-math" }
loam-scene     = { path = "crates/loam-scene" }
loam-shape     = { path = "crates/loam-shape" }
loam-time      = { path = "crates/loam-time" }
loam-shader    = { path = "crates/loam-shader" }
loam-render    = { path = "crates/loam-render" }
loam-asset     = { path = "crates/loam-asset" }
loam-input     = { path = "crates/loam-input" }
loam-camera    = { path = "crates/loam-camera" }
loam-player    = { path = "crates/loam-player" }
loam-physics   = { path = "crates/loam-physics" }
loam-app       = { path = "crates/loam-app" }
loam-text      = { path = "crates/loam-text" }

[features]
default = []
