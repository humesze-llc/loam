name: docs

# Build the workspace rustdoc and publish it to GitHub Pages on every push to
# main. Enable once under Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps for wgpu/winit
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            pkg-config
      # Mirror the `doc` gate: broken intra-doc links fail the build.
      - name: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace
      # cargo doc emits no workspace landing page; generate one linking every
      # crate so the Pages root lists all of them instead of dead-ending in one.
      # A folder with an all.html is a real crate's docs (unlike src/, etc.).
      - name: workspace docs index
        run: |
          cd target/doc
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<title>Loam API documentation</title>'
            echo '<style>body{font:16px/1.6 system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem}li{margin:.3rem 0}</style>'
            echo '</head><body><h1>Loam API documentation</h1>'
            echo '<p>A geometry engine for spaces where curvature and dimension are'
            echo 'structural. Start with <code>loam_math</code> and <code>loam_shape</code>'
            echo '(the stable surfaces).</p><ul>'
            for d in */; do
              name="${d%/}"
              [ -f "${d}all.html" ] && echo "<li><a href=\"${name}/index.html\"><code>${name}</code></a></li>"
            done
            echo '</ul></body></html>'
          } > index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc
      - id: deployment
        uses: actions/deploy-pages@v4
