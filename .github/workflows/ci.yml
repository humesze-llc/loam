name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps for wgpu/winit
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            pkg-config
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps for wgpu/winit + lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            mesa-vulkan-drivers \
            pkg-config
      - name: cargo test --workspace --all-targets
        run: cargo test --workspace --all-targets
      # CPU/GPU parity probes in loam-shader/db.rs are #[ignore]d
      # locally because they need a wgpu adapter. lavapipe (from
      # mesa-vulkan-drivers above) provides one in CI. Filter by
      # name so the loam-camera perf bench (the other #[ignore]d
      # test) does not run here. CONVENTIONS section 4 / 5 calls
      # CPU/GPU parity load-bearing for the engineering thesis;
      # this is the gate.
      - name: cargo test gpu_probe -- --include-ignored
        env:
          WGPU_BACKEND: vulkan
        run: cargo test --workspace gpu_probe -- --include-ignored

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps for wgpu/winit
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            pkg-config
      # `--no-deps` keeps the run fast and limits failures to our own
      # docs. `RUSTDOCFLAGS=-D warnings` makes broken intra-doc links
      # and missing-code-block-language warnings fail the build;
      # docstring drift is otherwise invisible until a reader hits it.
      - name: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace

  wasm-build:
    name: wasm32 build (polytope_playground)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Add the wasm target to the toolchain `rust-toolchain.toml` pins
      # (currently 1.95.0). The `targets:` input on the action above would
      # add it to `stable` instead, which the toml override then bypasses
      # at `cargo build` time, leaving the pinned toolchain without a
      # wasm32 std (the "can't find crate for `std`" failure). Running
      # `rustup target add` inside the checked-out repo respects the
      # override, so the target lands on the toolchain cargo actually uses.
      - run: rustup target add wasm32-unknown-unknown
      # Regression gate for the wasm32 target. Engine work on loam-app /
      # loam-render / loam-egui can silently break the wasm bundle (cfg-shims,
      # web-time, OffscreenCanvas worker plumbing). `--no-default-features`
      # drops polytope_playground's native-only `capture` feature so the
      # native encoder crates stay out of the wasm dep tree, matching
      # `index.html`'s `data-cargo-no-default-features` directive.
      - run: cargo build --target wasm32-unknown-unknown -p polytope_playground --no-default-features

  determinism:
    name: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The reproducibility contract: a fixed scenario replays bit-identically
      # (single-threaded f32 fixed-step). loam-physics is CPU-only, so this needs
      # no GPU/windowing deps and runs fast as its own visible gate.
      - run: cargo test -p loam-physics determinism
